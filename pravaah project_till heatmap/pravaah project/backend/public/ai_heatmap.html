<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temple Crowd Heatmap</title>

    <!-- Heatmap.js -->
    <script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        h1 { text-align: center; margin: 10px; }

        /*
         * FIX: position:relative + overflow:hidden clips the heatmap
         * canvas exactly to the map boundaries — no more full-page bleed.
         */
        #heatmapContainer {
            width: 800px;
            height: 600px;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        /*
         * FIX: Temple map is an <img> tag (not a CSS background) so
         * ai_heatmap.js can listen for its 'load' event and read real
         * offsetWidth / offsetHeight for coordinate scaling.
         */
        #templeMap {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }

        /* Keep heatmap.js canvas layered on top of the image */
        #heatmapContainer canvas {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            pointer-events: none;
        }

        #statusBar {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 16px; background: #0a0a0a; font-size: 0.85em;
        }
        #statusDot {
            width: 10px; height: 10px; border-radius: 50%; background: #e74c3c;
        }
        #statusDot.connected { background: #2ecc71; }

        #statsBar {
            display: flex; gap: 20px; padding: 8px 16px;
            background: #1a1a2e; justify-content: center; flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat span { display: block; font-size: 1.4em; font-weight: bold; color: #00d4ff; }
        .stat label { font-size: 0.75em; color: #aaa; }

        #controls {
            display: flex; gap: 10px; justify-content: center;
            padding: 8px; background: #222;
        }
        button {
            padding: 6px 16px; background: #333; color: white;
            border: 1px solid #555; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #444; }

        #info { padding: 10px; background: #222; }
        #alerts { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h1>🔥 Temple Crowd Heatmap</h1>

<div id="statusBar">
    <div id="statusDot"></div>
    <span id="statusText">Connecting…</span>
</div>

<div id="statsBar">
    <div class="stat"><span id="totalCount">0</span><label>Total People</label></div>
    <div class="stat"><span id="densityLevel">—</span><label>Density</label></div>
    <div class="stat"><span id="peakCount">0</span><label>Peak</label></div>
    <div class="stat"><span id="lastUpdate">—</span><label>Last Update</label></div>
</div>

<div id="heatmapContainer">
    <!-- FIX: real <img> tag so the JS load event fires and sizing works -->
    <img id="templeMap" src="assets/temple_1.png" alt="Temple Map">
</div>

<div id="controls">
    <button id="resetHeatmap">🔄 Reset Heatmap</button>
    <button id="toggleAnimation">⏸ Pause</button>
</div>

<div id="info">
    <p>
        Entrance: <strong id="entranceCount">0</strong> &nbsp;|&nbsp;
        Queue: <strong id="queueCount">0</strong> &nbsp;|&nbsp;
        Sanctum: <strong id="sanctumCount">0</strong> &nbsp;|&nbsp;
        Exit: <strong id="exitCount">0</strong>
    </p>
    <p>⏱ Estimated Wait: <span id="waiting">—</span></p>
    <p id="alerts"></p>
</div>

<script src="ai_heatmap.js"></script>

</body>
</html>
